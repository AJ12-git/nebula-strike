<script type="module">

const W = 1280, H = 720, DURATION = 30, BOIL_FPS = 12;

const INK = '#2b2118';
const cv = document.getElementById('c'), ctx = cv.getContext('2d');

// ---------------- helpers ----------------
const clamp = (x, a, b) => Math.min(b, Math.max(a, x));

// rough options: the seed changes BOIL_FPS times a second so outlines "boil" like hand-drawn cels

// watercolour fill slightly mis-registered from the ink line
let FILL_OFF = [2, -1.5];
function washPath(path, color, alpha = 0.92) {

}
function ellipsePath(cx, cy, w, h) { const p = new Path2D(); p.ellipse(cx, cy, Math.abs(w) / 2, Math.abs(h) / 2, 0, 0, Math.PI * 2); return p; }

function Cv(pts, o = {}) { rc.curve(pts, O(o)); }

// ---------------- paper texture ----------------

// ---------------- static background (painted once) ----------------

      g.fillStyle = '#b9c78a'; g.beginPath(); g.arc(x, y, 2.5, 0, 7); g.fill();

    wash(g, side, '#dcc39c', 1, [0, 0]);
    for (let i = 0; i < 60; i++) { g.globalAlpha = 0.06; g.fillStyle = '#c4a173'; g.beginPath(); g.arc(r() * CORNER, BG_Y0 + r() * 1000, 20 + r() * 50, 0, 7); g.fill(); }

    for (let i = 0; i < 70; i++) { const y = 626 + Math.floor(r() * 8) * 26, x = CORNER + r() * WORLD_W; brc.line(x, y - 13, x, y + 13, BO({ strokeWidth: 1.2, stroke: '#9b6a3e' })); }

    wash(g, new Path2D(poly([[wx, wy], [wx + ww, wy], [wx + ww, wy + wh], [wx, wy + wh]])), '#a9d4ec', 1, [0, 0]);

    for (const [a, b] of legs) { wash(g, new Path2D(poly([[a, 395], [b, 395], [b - 3, 642], [a + 3, 642]])), '#9c6b42', 1); brc.path(poly([[a, 395], [b, 395], [b - 3, 642], [a + 3, 642]]), BO()); }
    const top = poly([[1490, 380], [1910, 380], [1910, 400], [1490, 400]]);
    wash(g, new Path2D(top), '#b47c4c', 1); brc.path(top, BO());
    brc.line(1495, 641, 1560, 641, BO({ strokeWidth: 3, stroke: 'rgba(60,40,20,0.35)' })); brc.line(1840, 641, 1905, 641, BO({ strokeWidth: 3, stroke: 'rgba(60,40,20,0.35)' }));

  });

// ---------------- characters ----------------
const MOUSE = { fur: '#b9b3ab', dark: '#8f8880', belly: '#ece6dc', ear: '#f2a7b5', nose: '#e8708a', scarf: '#d8433a' };
const CAT = { fur: '#ef9a46', dark: '#c26a2a', stripe: '#a5521f', cream: '#fbe7c9', nose: '#e8708a', iris: '#9ccc5a' };

function cheesePath(x, y, s, bite = 0) {

// ---- mouse (local coords: feet at 0,0, facing +x) ----

  const p = `M ${x - 122} ${y - 20} Q ${x - 120} ${y + 14} ${x - 90} ${y + 16} L ${x + 90} ${y + 16} Q ${x + 120} ${y + 14} ${x + 122} ${y - 20} Q ${x} ${y + 2} ${x - 122} ${y - 20} Z`;
  P(p, '#b98146'); rc.path(p, O({ stroke: 'none', fill: '#7a4f22', fillStyle: 'cross-hatch', hachureGap: 9, fillWeight: 1 }));
}
function drawRug(t) {
  const u = smooth(18.45, 18.8, t), x0 = lerp(1030, 1110, u), x1 = lerp(1420, 1330, u);
  const top = []; const n = 12;
  for (let i = 0; i <= n; i++) { const x = lerp(x0 + 30, x1 + 30, i / n); top.push([x, 652 - u * Math.max(0, Math.sin(i / n * Math.PI * 3)) * 22]); }
  const pts = [[x0, 690], ...top.map(p => [p[0] - 30, p[1]]), [x1, 690]];
  const d = 'M' + pts.map(p => p.join(' ')).join(' L') + ' Z';
  P(d, '#c7504a'); rc.path(d, O({ stroke: 'none', fill: '#f2d38a', fillStyle: 'zigzag', hachureGap: 14, fillWeight: 1.4 }));

function drawPlant(t) {
  const w = t > 16.55 ? Math.sin((t - 16.55) * 16) * 0.22 * Math.exp(-(t - 16.55) * 2.2) : 0;
  ctx.save(); ctx.translate(2410, 640); ctx.rotate(w);
  for (const [a, l] of [[-1.9, 120], [-1.6, 150], [-1.3, 125], [-2.2, 90], [-1.0, 95]]) { ctx.save(); ctx.rotate(a + Math.PI / 2); E(0, -l / 2 - 50, 34, l, '#6aa858'); Ln(0, -50, 0, -l - 40, { strokeWidth: 1.4 }); ctx.restore(); }
  P(poly([[-40, -60], [40, -60], [30, 0], [-30, 0]]), '#c86f43');
  ctx.restore();
}
function drawPlate(t) {
  if (t < 14.2) { E(1745, 376, 96, 14, '#f4f1ea', { strokeWidth: 2 }); E(1745, 375, 64, 7, null, { strokeWidth: 1.2, stroke: '#7aa7cf' }); if (t < 11.9) drawCheese(1745, 360, 0.75); return; }
  const r = mulberry32(5), dt = t - 14.2;
  for (let i = 0; i < 7; i++) {
    const vx = (r() - 0.5) * 520, vy = -200 - r() * 260, rot0 = r() * 6;
    let x = 1745 + vx * dt, y = 376 + vy * dt + 900 * dt * dt;
    const onTable = Math.abs(x - 1700) < 215, ground = onTable && dt < 0.5 ? 382 : FLOOR + 6;
    if (y > ground) { const tl = (-vy + Math.sqrt(vy * vy + 3600 * (ground - 376))) / 1800; x = 1745 + vx * tl; y = ground; }
    ctx.save(); ctx.translate(x, y); ctx.rotate(rot0 + (y < ground ? dt * 9 : 0));
    P(poly([[-12, -4], [12, -6], [4, 7]]), '#f4f1ea', { strokeWidth: 1.6 }); ctx.restore();

}
function frameState(t) {
  if (t < 21.1) return { x: 222, y: 330, rot: 0 };
  if (t < 22.0) { const k = (t - 21.1); return { x: 222, y: 330, rot: Math.sin(k * 14) * 0.12 * (1 + k * 2) }; }
  if (t < 22.35) { const u = easeIn(seg(22.0, 22.35, t)); return { x: lerp(222, 205, u), y: lerp(330, 450, u), rot: lerp(0.3, 0.1, u) }; }
  return null;
}

// ---------------- effects ----------------
function puff(x, y, s, age, life = 0.6) {
  if (age < 0 || age > life) return; const u = age / life;
  ctx.save(); ctx.globalAlpha = 1 - u;
  for (let k = 0; k < 4; k++) { const a = k * 1.7 + x; E(x + Math.cos(a) * s * (0.4 + u), y - Math.abs(Math.sin(a)) * s * 0.5 * (0.4 + u) - u * 10, s * (0.6 + u * 0.8), s * (0.5 + u * 0.7), '#efe4d0', { strokeWidth: 1.6 }); }

}
function speedLines(x, y, dir, h) { for (let k = 0; k < 4; k++) { const yy = y - k * h / 4 - 8, l = 40 + (k * 37 % 30); Ln(x - dir * 20, yy, x - dir * (20 + l), yy, { strokeWidth: 1.6, roughness: 0.6 }); } }

  P(poly(pts), '#ffd84a', { strokeWidth: 2.6 });

}
function exclaim(x, y, t0, t, ch = '!') { const a = t - t0; if (a < 0 || a > 0.55) return; const s = a < 0.08 ? a / 0.08 : 1; text(ch, x, y - s * 10, 64 * s, '#d8332a'); }
function stars(cx, cy, rx, ry, t, n = 4) {
  for (let i = 0; i < n; i++) {
    const a = t * 4 + i / n * 6.283, x = cx + Math.cos(a) * rx, y = cy + Math.sin(a) * ry, s = 12;
    const pts = []; for (let k = 0; k < 10; k++) { const r = k % 2 ? s * 0.45 : s; pts.push([x + Math.cos(k * 0.628 - 1.57) * r, y + Math.sin(k * 0.628 - 1.57) * r]); }
    P(poly(pts), '#ffd84a', { strokeWidth: 1.6 });

}
function sparkle(x, y, s) { Ln(x - s, y, x + s, y, { strokeWidth: 2, stroke: '#f2b51c' }); Ln(x, y - s, x, y + s, { strokeWidth: 2, stroke: '#f2b51c' }); }
function thought(x, y, a) {
  if (a < 0) return; const s = Math.min(1, a / 0.2);
  E(x - 18, y + 46, 8 * s, 8 * s, '#ffffff', { strokeWidth: 1.6 }); E(x - 8, y + 30, 14 * s, 14 * s, '#ffffff', { strokeWidth: 1.6 });
  E(x + 20, y - 10, 110 * s, 80 * s, '#ffffff', { strokeWidth: 2 });
  if (s >= 1) { drawCheese(x + 14, y - 10, 0.75); sparkle(x + 50, y - 34, 6 + Math.sin(a * 20) * 2); }
}

// ---------------- camera ----------------
function camTarget(t) {
  if (t < 3.5) return [330, 530, 2.1];
  if (t < 9.0) return [mouseAt(t).x + 90, 520, 1.6];
  if (t < 12.45) return [1640, 420, 1.55];
  if (t < 14.5) return [1340, 450, 0.9];
  if (t < 21.1) { const m = mouseAt(t), c = catAt(t); return [(m.x + c.x) / 2, 480, 1.1]; }
  if (t < 23.8) return [400, 470, 1.45];
  return [380, 520, 1.7];
}
function camera(t) {
  // temporal smoothing within a shot keeps the follow-cam from jerking on direction changes
  const cuts = [3.5, 9.0, 12.45, 14.5, 21.1, 23.8, 99];
  const s0 = cuts.findIndex(c => t < c), lo = s0 > 0 ? cuts[s0 - 1] : 0, hi = cuts[s0];
  let x = 0, y = 0, z = 0, n = 0;
  for (let k = -8; k <= 8; k++) { const tt = clamp(t + k * 0.06, lo, hi - 1e-3); const [a, b, c] = camTarget(tt); x += a; y += b; z += c; n++; }
  x /= n; y /= n; z /= n;
  const hw = W / 2 / z; x = clamp(x, hw, WORLD_W - hw);
  // impacts shake the camera
  let sh = 0; for (const [t0, a] of [[14.2, 9], [15.35, 4], [19.05, 6], [21.1, 16], [22.35, 5], [23.6, 9]]) { const d = t - t0; if (d > 0 && d < 0.5) sh += a * Math.exp(-d * 9); }
  return [x + Math.sin(t * 91) * sh, y + Math.cos(t * 77) * sh, z];
}

// ---------------- frame ----------------
window.renderAt = (t) => {
  boil = Math.floor(t * BOIL_FPS); sc = 0;
  const [cx, cy, z] = camera(t);
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  ctx.drawImage(paper, 0, 0);
  ctx.setTransform(z, 0, 0, z, W / 2 - cx * z, H / 2 - cy * z);
  ctx.drawImage(bg, 0, BG_Y0);
  const m = mouseAt(t), c = catAt(t);
  // eyes glowing in the hole
  if (t < 0.9) { const bl = (t > 0.45 && t < 0.55) ? 0.15 : 1; E(130, 612, 8, 11 * bl, '#ffffff', { strokeWidth: 1.4 }); E(144, 611, 8, 11 * bl, '#ffffff', { strokeWidth: 1.4 }); if (bl === 1) { E(132, 613, 4, 5, INK, { stroke: 'none', alpha: 1 }); E(146, 612, 4, 5, INK, { stroke: 'none', alpha: 1 }); } }
  const fs = frameState(t); if (fs) drawFrame(fs.x, fs.y, fs.rot);

  drawRug(t); drawPlant(t);
  drawBasket(false);
  if (c.pose === 'sleep' || c.pose === 'wake' || (t < 13.45)) { drawCat(c, t); drawBasket(true); drawPlate(t); drawMouse(m, t); }
  else { drawBasket(true); drawPlate(t); drawCat(c, t); drawMouse(m, t); }
  // floor dust while running
  const runPuffs = (who, from, to) => { for (let tt = Math.floor(from / 0.12) * 0.12; tt < Math.min(t, to); tt += 0.12) { const p = who(tt); puff(p.x - (p.face || 1) * 20, p.y, 14, t - tt, 0.45); } };
  if (t > 14.05 && t < 21.5) runPuffs(mouseAt, 14.1, 20.9);
  if (t > 15.35 && t < 21.6) { runPuffs(catAt, 15.4, 15.95); runPuffs(catAt, 16.9, 18.45); runPuffs(catAt, 19.7, 21.1); }
  if (t > 15.95 && t < 17.2) for (let tt = 15.95; tt < Math.min(t, 16.6); tt += 0.06) { const p = catAt(tt); puff(p.x + 50, FLOOR, 22, t - tt, 0.7); }
  for (const [t0, x, y, s] of [[14.2, 1735, TABLE_Y, 30], [15.35, 1930, FLOOR, 26], [18.5, 1400, FLOOR, 30], [19.05, 1290, FLOOR, 34], [21.0, 140, FLOOR - 10, 22], [21.1, 200, FLOOR - 60, 40], [23.6, 330, FLOOR, 40]]) puff(x, y, s, t - t0, 0.8);
  if (m.visible && m.pose === 'run') speedLines(m.x, m.y - 10, m.face, 50);

  thought(220, 470, t > 2.75 && t < 3.55 ? t - 2.75 : -1);
  if (t > 11.9 && t < 13.3) for (let k = 0; k < 3; k++) { const a = t * 3 + k * 2.1; sparkle(1716 + Math.cos(a) * 34, TABLE_Y - 96 + Math.sin(a * 1.3) * 20, 5 + 3 * Math.abs(Math.sin(a * 2))); }
  exclaim(890, 560, 6.0, t); exclaim(990, 480, 13.0, t); exclaim(1716, 280, 13.3, t); exclaim(1790, 160, 14.45, t, '?'); exclaim(1800, 150, 14.75, t); exclaim(2300, 420, 15.95, t, '?!');
  if ((t > 14.75 && t < 15.1) || (t > 19.45 && t < 19.9)) { const p = catAt(t); for (let k = 0; k < 2; k++) puff(p.x + (k ? 30 : -20) * (p.face || 1), p.y - 250, 12, (t * 3 + k * 0.5) % 0.5, 0.5); }
  bang(250, 470, 'BONK!', 70, 21.1, t, -0.12);
  bang(1735, 330, 'CRASH!', 54, 14.2, t, 0.1);
  if (t > 21.15 && catHead.ok) {
    ctx.save(); const sm = catHead.m; const pt = new DOMPoint(catHead.x, catHead.y - 40).matrixTransform(sm);
    ctx.setTransform(z, 0, 0, z, W / 2 - cx * z, H / 2 - cy * z); const inv = ctx.getTransform().inverse(); const wp = pt.matrixTransform(inv);
    stars(wp.x, wp.y - (t > 23.6 ? 10 : 30), 60, 16, t); ctx.restore();

  if (t > 27.0) {
    const mx = (165 - cx) * z + W / 2, my = (FLOOR - 60 - cy) * z + H / 2;
    const r = lerp(900, 0, easeIn(seg(27.0, 28.0, t)));
    ctx.fillStyle = '#0b0806'; ctx.beginPath(); ctx.rect(0, 0, W, H); ctx.arc(mx, my, Math.max(0.1, r), 0, Math.PI * 2, true); ctx.fill('evenodd');
    if (r > 1) rc.circle(mx, my, r * 2, O({ strokeWidth: 3, stroke: '#2b2118' }));

</script>
