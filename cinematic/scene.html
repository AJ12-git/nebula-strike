<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Nebula Strike Cinematic</title>
<style>
  html, body { margin: 0; background: #000; overflow: hidden; }
  #wrap { position: relative; width: 1280px; height: 720px; overflow: hidden; }
  canvas { display: block; }
  .ov { position: absolute; inset: 0; pointer-events: none; }
  #white { background: #fff; opacity: 0; }
  #black { background: #000; opacity: 0; }
  .bar { position: absolute; left: 0; right: 0; height: 88px; background: #000; }
  #barTop { top: 0; } #barBot { bottom: 0; }
  #title { display: flex; flex-direction: column; align-items: center; justify-content: center; opacity: 0; }
  #title h1 {
    margin: 0; font-family: "Inter Display", "Inter", sans-serif; font-weight: 900;
    font-size: 96px; white-space: nowrap; color: #eaf6ff; letter-spacing: 0.2em; padding-left: 0.2em;
    text-shadow: 0 0 12px #5fd0ff, 0 0 36px #2a7bff, 0 0 80px #6a2cff;
  }

<body>
<div id="wrap">
  <div class="ov" id="white"></div>
  <div class="ov" id="black"></div>
  <div class="ov" id="title"><h1>NEBULA STRIKE</h1><div class="line"></div><p>PREPARE FOR LAUNCH</p></div>
  <div class="bar" id="barTop"></div><div class="bar" id="barBot"></div>
</div>
<script type="module">
import * as THREE from 'three';
import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';
import { OutputPass } from 'three/addons/postprocessing/OutputPass.js';
import { ShaderPass } from 'three/addons/postprocessing/ShaderPass.js';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';

const W = 1280, H = 720, DURATION = 27;
// ---------------- timeline ----------------
// 0-4    A  fighter bursts out of the nebula
// 4-9    B  head-on fight with the escort fleet
// 9-19   D  dogfight alongside the giant mothership (reveal, deck run, loop, reversal)
// 19-22  C  charged shot into the main engines, escape, chain explosion, white-out
// 22-27  T  aftermath + title
const DOG = 9.0, LOOP0 = 15.0, LOOP1 = 17.4, CSHOT = 19.0;
const CHARGE = 19.6, FIRE = 20.05, HIT = 20.4, FINAL = 21.6, TITLE = 22.9;

// ---------- helpers ----------
function mulberry32(a) { return function () { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
const rand = mulberry32(20261111);
const R = (a, b) => a + (b - a) * rand();
const clamp = (x, a, b) => Math.min(b, Math.max(a, x));
const smooth = (e0, e1, x) => { const t = clamp((x - e0) / (e1 - e0), 0, 1); return t * t * (3 - 2 * t); };
const lerp = (a, b, t) => a + (b - a) * t;
const V = (x, y, z) => new THREE.Vector3(x, y, z);
function gauss() { let u = 0, v = 0; while (u === 0) u = rand(); v = rand(); return Math.sqrt(-2 * Math.log(u)) * Math.cos(2 * Math.PI * v); }
function randUnit() { return V(gauss(), gauss(), gauss()).normalize(); }
const hdr = (r, g, b) => new THREE.Color(r, g, b);

// ---------- renderer ----------
const renderer = new THREE.WebGLRenderer({ antialias: true, preserveDrawingBuffer: true });
renderer.setPixelRatio(1);
renderer.setSize(W, H);
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.05;
document.getElementById('wrap').prepend(renderer.domElement);

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x010208);
const camera = new THREE.PerspectiveCamera(48, W / H, 0.1, 8000);

const pmrem = new THREE.PMREMGenerator(renderer);
scene.environment = pmrem.fromScene(new RoomEnvironment(), 0.04).texture;
scene.environmentIntensity = 0.35;

// ---------- textures ----------
function canvasTex(size, draw) {
  const c = document.createElement('canvas'); c.width = c.height = size;
  draw(c.getContext('2d'), size);
  const t = new THREE.CanvasTexture(c); t.colorSpace = THREE.SRGBColorSpace; return t;
}
const softTex = canvasTex(128, (g, s) => {
  const gr = g.createRadialGradient(s / 2, s / 2, 0, s / 2, s / 2, s / 2);
  gr.addColorStop(0, 'rgba(255,255,255,1)'); gr.addColorStop(0.18, 'rgba(255,255,255,0.75)');
  gr.addColorStop(0.45, 'rgba(255,255,255,0.18)'); gr.addColorStop(1, 'rgba(255,255,255,0)');
  g.fillStyle = gr; g.fillRect(0, 0, s, s);
});
const cloudTexes = [0, 1, 2, 3].map(() => canvasTex(256, (g, s) => {
  for (let i = 0; i < 46; i++) {
    const r = R(18, 70), a = R(0, Math.PI * 2), d = R(0, 70);
    const x = s / 2 + Math.cos(a) * d, y = s / 2 + Math.sin(a) * d;
    const gr = g.createRadialGradient(x, y, 0, x, y, r);
    gr.addColorStop(0, `rgba(255,255,255,${R(0.12, 0.35)})`); gr.addColorStop(1, 'rgba(255,255,255,0)');
    g.fillStyle = gr; g.fillRect(0, 0, s, s);
  }
  g.globalCompositeOperation = 'destination-in';
  const m = g.createRadialGradient(s / 2, s / 2, 0, s / 2, s / 2, s / 2);
  m.addColorStop(0, 'rgba(0,0,0,1)'); m.addColorStop(0.6, 'rgba(0,0,0,0.6)'); m.addColorStop(1, 'rgba(0,0,0,0)');
  g.fillStyle = m; g.fillRect(0, 0, s, s);
}));
// panel texture for the mothership hull
const panelTex = (() => {
  const c = document.createElement('canvas'); c.width = c.height = 512; const g = c.getContext('2d');
  g.fillStyle = '#6a6472'; g.fillRect(0, 0, 512, 512);
  for (let i = 0; i < 260; i++) {
    const v = Math.floor(R(70, 125)); g.fillStyle = `rgb(${v},${v - 4},${v + 8})`;
    g.fillRect(Math.floor(R(0, 32)) * 16, Math.floor(R(0, 32)) * 16, Math.floor(R(1, 6)) * 16, Math.floor(R(1, 4)) * 16);
  }
  g.strokeStyle = 'rgba(20,18,26,0.7)'; g.lineWidth = 2;
  for (let i = 0; i <= 512; i += 64) { g.beginPath(); g.moveTo(i, 0); g.lineTo(i, 512); g.stroke(); g.beginPath(); g.moveTo(0, i); g.lineTo(512, i); g.stroke(); }
  const t = new THREE.CanvasTexture(c); t.colorSpace = THREE.SRGBColorSpace; t.wrapS = t.wrapT = THREE.RepeatWrapping; t.repeat.set(3, 6); return t;
})();

// ---------- lights ----------
scene.add(new THREE.AmbientLight(0x30406a, 0.55));
const sun = new THREE.DirectionalLight(0xffd6b0, 2.6); sun.position.set(-1, 0.8, 1.2); scene.add(sun);
const rim = new THREE.DirectionalLight(0x6a8cff, 2.2); rim.position.set(1.2, 0.4, -1.5); scene.add(rim);
const fillPink = new THREE.DirectionalLight(0xff4fb0, 0.8); fillPink.position.set(0, -1, 0.3); scene.add(fillPink);
const lightPool = [0, 1, 2, 3].map(() => { const l = new THREE.PointLight(0xffa060, 0, 0, 2); scene.add(l); return l; });

// ---------- stars & dust ----------
function starLayer(n, size, rMin, rMax) {
  const pos = new Float32Array(n * 3), col = new Float32Array(n * 3);
  for (let i = 0; i < n; i++) {
    const v = randUnit().multiplyScalar(R(rMin, rMax));
    pos.set([v.x, v.y, v.z], i * 3);
    const tint = rand(), b = R(0.4, 1.3);
    col.set(tint < 0.2 ? [b, b * 0.8, b * 0.6] : tint < 0.45 ? [b * 0.7, b * 0.85, b * 1.2] : [b, b, b], i * 3);
  }
  const g = new THREE.BufferGeometry();
  g.setAttribute('position', new THREE.BufferAttribute(pos, 3));
  g.setAttribute('color', new THREE.BufferAttribute(col, 3));
  const p = new THREE.Points(g, new THREE.PointsMaterial({ size, sizeAttenuation: false, vertexColors: true, map: softTex, transparent: true, depthWrite: false, blending: THREE.AdditiveBlending }));
  p.frustumCulled = false; scene.add(p); return p;
}
starLayer(5000, 2.2, 3500, 4500);
starLayer(600, 4.0, 3500, 4500);
function dust(n, x0, x1, y0, y1, z0, z1) {
  const pos = new Float32Array(n * 3);
  for (let i = 0; i < n; i++) pos.set([R(x0, x1), R(y0, y1), R(z0, z1)], i * 3);
  const g = new THREE.BufferGeometry(); g.setAttribute('position', new THREE.BufferAttribute(pos, 3));
  scene.add(new THREE.Points(g, new THREE.PointsMaterial({ size: 0.35, color: 0x8fb4ff, map: softTex, transparent: true, opacity: 0.7, depthWrite: false, blending: THREE.AdditiveBlending })));
}
dust(2500, -70, 70, -45, 45, -260, 420);
dust(3500, -160, 200, -20, 170, 380, 1120);

// ---------- nebula ----------
function nebula(center, spread, colors, count, sMin, sMax, oMin, oMax) {
  for (let i = 0; i < count; i++) {
    const m = new THREE.SpriteMaterial({ map: cloudTexes[i % 4], color: new THREE.Color(colors[i % colors.length]), transparent: true, opacity: R(oMin, oMax), depthWrite: false, blending: THREE.AdditiveBlending, rotation: R(0, 6.28) });
    const s = new THREE.Sprite(m);
    s.position.set(center.x + gauss() * spread.x, center.y + gauss() * spread.y, center.z + gauss() * spread.z);
    const sc = R(sMin, sMax); s.scale.set(sc, sc, 1);
    scene.add(s);
  }
}
nebula(V(0, 0, -300), V(200, 110, 120), ['#5a24ff', '#2456ff', '#ff3a9e', '#17c4ff', '#8a2cff'], 170, 90, 260, 0.06, 0.2);
nebula(V(0, 0, -130), V(45, 28, 50), ['#6a3cff', '#3a7bff', '#ff5ab4'], 30, 25, 70, 0.04, 0.1);
nebula(V(100, 150, 1700), V(800, 340, 160), ['#ff5a1e', '#ff2a4a', '#b02aff', '#ff8a3a'], 150, 300, 700, 0.05, 0.16);
// a second, cooler nebula wall for shots that look back toward -z from above the mothership
nebula(V(300, 250, 200), V(500, 200, 200), ['#3a2cff', '#ff3a9e', '#17a4ff'], 70, 200, 450, 0.03, 0.09);

// ---------- planet ----------
{
  const tex = canvasTex(512, (g, s) => {
    for (let y = 0; y < s; y++) {
      const v = Math.sin(y * 0.05) * 0.5 + Math.sin(y * 0.013 + 1) * 0.5 + Math.sin(y * 0.21) * 0.15;
      const c = 0.5 + 0.5 * v;
      g.fillStyle = `rgb(${Math.floor(30 + 60 * c)},${Math.floor(70 + 90 * c)},${Math.floor(110 + 100 * c)})`;
      g.fillRect(0, y, s, 1);
    }
  });
  const planet = new THREE.Mesh(new THREE.SphereGeometry(300, 64, 48), new THREE.MeshStandardMaterial({ map: tex, roughness: 1, metalness: 0 }));
  planet.position.set(-950, -380, 2100); planet.rotation.z = 0.35;
  scene.add(planet);
  const atm = new THREE.Sprite(new THREE.SpriteMaterial({ map: softTex, color: hdr(0.25, 0.55, 1.2), transparent: true, opacity: 0.55, depthWrite: false, blending: THREE.AdditiveBlending }));
  atm.position.copy(planet.position).add(V(0, 0, 60)); atm.scale.set(840, 840, 1); scene.add(atm);
}

// ---------- materials ----------
const hullMat = new THREE.MeshStandardMaterial({ color: 0xc9d3e2, metalness: 0.55, roughness: 0.32, flatShading: true, side: THREE.DoubleSide });
const accentMat = new THREE.MeshStandardMaterial({ color: 0x1d5cff, metalness: 0.4, roughness: 0.35, flatShading: true, side: THREE.DoubleSide });
const darkMat = new THREE.MeshStandardMaterial({ color: 0x23262e, metalness: 0.6, roughness: 0.45, flatShading: true, side: THREE.DoubleSide });
const glassMat = new THREE.MeshStandardMaterial({ color: 0x0b1a3a, metalness: 0.9, roughness: 0.08, emissive: 0x0a2a66, emissiveIntensity: 0.6 });
const glowBlue = new THREE.MeshBasicMaterial({ color: hdr(0.4, 1.0, 2.6), toneMapped: false });
const glowRed = new THREE.MeshBasicMaterial({ color: hdr(4.5, 0.5, 0.45), toneMapped: false });
const glowOrange = new THREE.MeshBasicMaterial({ color: hdr(3.2, 1.3, 0.5), toneMapped: false });
const enemyHull = new THREE.MeshStandardMaterial({ color: 0x5a5262, metalness: 0.75, roughness: 0.38, flatShading: true, side: THREE.DoubleSide });
const motherHull = new THREE.MeshStandardMaterial({ map: panelTex, color: 0x8a8394, metalness: 0.55, roughness: 0.5, flatShading: true, side: THREE.DoubleSide });

function extrudeShape(points, depth) {
  const sh = new THREE.Shape(points.map(p => new THREE.Vector2(p[0], p[1])));
  return new THREE.ExtrudeGeometry(sh, { depth, bevelEnabled: false });
}
function glowSprite(color, scale, opacity = 1) {
  const s = new THREE.Sprite(new THREE.SpriteMaterial({ map: softTex, color, transparent: true, opacity, depthWrite: false, blending: THREE.AdditiveBlending }));
  s.scale.set(scale, scale, 1); return s;
}

// ---------- player fighter (nose = +z) ----------
const fighter = new THREE.Group();
const flames = [];
{
  const body = new THREE.Mesh(new THREE.CylinderGeometry(0.55, 0.95, 6, 8).rotateX(Math.PI / 2), hullMat); fighter.add(body);
  const nose = new THREE.Mesh(new THREE.ConeGeometry(0.55, 3, 8).rotateX(Math.PI / 2), hullMat); nose.position.z = 4.5; fighter.add(nose);
  const cockpit = new THREE.Mesh(new THREE.SphereGeometry(0.55, 14, 10), glassMat); cockpit.scale.set(1, 0.75, 2.4); cockpit.position.set(0, 0.55, 1.6); fighter.add(cockpit);
  const wingGeo = extrudeShape([[0.6, 1.6], [5.6, -2.0], [5.8, -3.0], [0.6, -2.9]], 0.16).rotateX(Math.PI / 2);
  fighter.add(new THREE.Mesh(wingGeo, hullMat), new THREE.Mesh(wingGeo.clone().scale(-1, 1, 1), hullMat));
  const stripeGeo = extrudeShape([[1.0, 0.6], [5.0, -2.1], [5.15, -2.5], [1.0, -0.1]], 0.05).rotateX(Math.PI / 2).translate(0, 0.03, 0);
  fighter.add(new THREE.Mesh(stripeGeo, accentMat), new THREE.Mesh(stripeGeo.clone().scale(-1, 1, 1), accentMat));
  const finGeo = extrudeShape([[-3.2, 0], [-1.0, 0], [-2.7, 2.1], [-3.5, 2.1]], 0.12).rotateY(-Math.PI / 2);
  for (const sx of [-1, 1]) {
    const fin = new THREE.Mesh(finGeo, accentMat); fin.position.set(sx * 1.25, 0.2, 0); fin.rotation.z = -sx * 0.32; fighter.add(fin);
    const eng = new THREE.Mesh(new THREE.CylinderGeometry(0.38, 0.5, 2.4, 12).rotateX(Math.PI / 2), darkMat); eng.position.set(sx * 0.95, -0.15, -2.6); fighter.add(eng);
    const disk = new THREE.Mesh(new THREE.CircleGeometry(0.36, 16).rotateY(Math.PI), glowBlue); disk.position.set(sx * 0.95, -0.15, -3.82); fighter.add(disk);
    const flame = new THREE.Mesh(new THREE.ConeGeometry(0.34, 3.2, 12, 1, true).rotateX(-Math.PI / 2).translate(0, 0, -1.6),
      new THREE.MeshBasicMaterial({ color: hdr(0.5, 1.4, 4.0), transparent: true, opacity: 0.32, blending: THREE.AdditiveBlending, depthWrite: false, toneMapped: false }));
    flame.position.set(sx * 0.95, -0.15, -3.85); fighter.add(flame); flames.push(flame);
    const g = glowSprite(hdr(0.3, 0.7, 2.0), 2.2, 0.6); g.position.set(sx * 0.95, -0.15, -4.2); fighter.add(g);
    const nav = new THREE.Mesh(new THREE.SphereGeometry(0.12, 8, 6), new THREE.MeshBasicMaterial({ color: sx > 0 ? hdr(0.3, 3, 0.6) : hdr(3, 0.3, 0.3), toneMapped: false }));
    nav.position.set(sx * 5.7, 0, -2.5); fighter.add(nav);
  }
  const spine = new THREE.Mesh(new THREE.BoxGeometry(0.12, 0.06, 4.5), glowBlue); spine.position.set(0, 0.62, -1.4); fighter.add(spine);
}
scene.add(fighter);

// ---------- mothership: 3x scale, narrow nose toward -z, main engines at +z ----------
const MS = 3, MC = V(0, 0, 700);                       // scale and world centre
const hullR = lz => lerp(14, 34, (lz + 65) / 130);      // local hull radius along local z
const mother = new THREE.Group();
const motherLocal = []; // named local points
{
  const hull = new THREE.Mesh(new THREE.CylinderGeometry(14, 34, 130, 6, 4).rotateX(-Math.PI / 2), motherHull); hull.scale.y = 0.38; mother.add(hull);
  const belly = new THREE.Mesh(new THREE.CylinderGeometry(10, 24, 110, 6).rotateX(-Math.PI / 2), darkMat); belly.scale.y = 0.3; belly.position.set(0, -6, 8); mother.add(belly);
  // flat flight deck along the ridge
  const deck = new THREE.Mesh(new THREE.BoxGeometry(14, 4, 100), motherHull); deck.position.set(0, 11, 10); mother.add(deck);
  // deck edge runway lights
  const lightGeo = new THREE.BoxGeometry(0.5, 0.3, 1.2);
  const lights = new THREE.InstancedMesh(lightGeo, glowOrange, 104); const m4 = new THREE.Matrix4(); let li = 0;
  for (let z = -39; z <= 59; z += 3.8) for (const sx of [-1, 1]) { m4.makeTranslation(sx * 6.6, 13.2, z); lights.setMatrixAt(li++, m4); }
  lights.count = li; mother.add(lights);
  // bridge tower (off-centre so the deck run can slip past it)
  const tower = new THREE.Mesh(new THREE.BoxGeometry(9, 16, 16), motherHull); tower.position.set(12, 20, 34); mother.add(tower);
  const towerTop = new THREE.Mesh(new THREE.BoxGeometry(12, 3, 9), darkMat); towerTop.position.set(12, 29.5, 33); mother.add(towerTop);
  const bridge = new THREE.Mesh(new THREE.BoxGeometry(12.2, 0.8, 1), glowOrange); bridge.position.set(12, 29, 28.4); mother.add(bridge);
  const antenna = new THREE.Mesh(new THREE.CylinderGeometry(0.2, 0.2, 10, 6), darkMat); antenna.position.set(14, 36, 34); mother.add(antenna);
  // deck turrets
  for (const [x, z] of [[-6, -30], [6, -12], [-6, 6], [6, 22], [-6, 48]]) {
    const base = new THREE.Mesh(new THREE.CylinderGeometry(1.6, 2, 2, 8), darkMat); base.position.set(x, 14, z); mother.add(base);
    const gun = new THREE.Mesh(new THREE.BoxGeometry(0.5, 0.5, 4), darkMat); gun.position.set(x, 15.3, z - 1.5); gun.rotation.x = 0.5; mother.add(gun);
    const tl = new THREE.Mesh(new THREE.SphereGeometry(0.35, 8, 6), glowRed); tl.position.set(x, 15.4, z); mother.add(tl);
    motherLocal.push(V(x, 15.5, z));
  }
  // side engine pods
  for (const sx of [-1, 1]) {
    const pod = new THREE.Mesh(new THREE.CylinderGeometry(6, 5, 50, 8).rotateX(-Math.PI / 2), darkMat); pod.position.set(sx * 34, -2, 30); mother.add(pod);
    const pg = glowSprite(hdr(3, 0.6, 0.25), 20, 0.9); pg.position.set(sx * 34, -2, 57); mother.add(pg);
  }
  // main engines at the tail
  for (const [x, y] of [[-12, 0], [12, 0], [0, 2]]) {
    const ring = new THREE.Mesh(new THREE.CylinderGeometry(6, 7, 6, 12, 1, true).rotateX(-Math.PI / 2), darkMat); ring.position.set(x, y, 66); mother.add(ring);
    const disc = new THREE.Mesh(new THREE.CircleGeometry(5.6, 20), new THREE.MeshBasicMaterial({ color: hdr(3.5, 1.2, 0.6), toneMapped: false })); disc.position.set(x, y, 68.5); mother.add(disc);
    const g = glowSprite(hdr(3, 1.1, 0.5), 26, 0.9); g.position.set(x, y, 71); mother.add(g);
  }
  // hull windows
  const winGeo = new THREE.BoxGeometry(0.6, 0.3, 1.4);
  const wins = new THREE.InstancedMesh(winGeo, glowOrange, 320);
  for (let i = 0; i < 320; i++) {
    const z = R(-58, 62), side = rand() < 0.5 ? -1 : 1, w = hullR(z) * 0.9;
    m4.makeTranslation(side * w * R(0.55, 0.97), R(-4, 4.5), z); wins.setMatrixAt(i, m4);
  }
  mother.add(wins);
  // greebles on the upper hull
  const greb = new THREE.InstancedMesh(new THREE.BoxGeometry(1, 1, 1), darkMat, 450);
  for (let i = 0; i < 450; i++) {
    const z = R(-60, 62), r = hullR(z), th = R(-1.0, 1.0);
    const x = Math.sin(th) * r * 0.86, y = 0.38 * Math.cos(th) * r * 0.97;
    if (Math.abs(x) < 8 && z > -40 && z < 60) continue;            // keep the deck clear
    const sx = R(0.6, 3), sy = R(0.4, 2), sz = R(0.8, 5);
    m4.compose(V(x, y, z), new THREE.Quaternion().setFromEuler(new THREE.Euler(0, 0, -th * 0.4)), V(sx, sy, sz)); greb.setMatrixAt(i, m4);
  }
  mother.add(greb);
  const core = glowSprite(hdr(4, 0.4, 0.4), 22, 1); core.position.set(0, 0, -66); mother.add(core);
}
mother.scale.setScalar(MS); mother.position.copy(MC);
scene.add(mother);
const ML = v => v.clone().multiplyScalar(MS).add(MC);   // mothership local -> world
const turretsW = motherLocal.map(ML);
const ENGINE = ML(V(0, 2, 68));

// ---------- fighter path ----------
// t < DOG: straight run toward the escort fleet (speed eases from 40 to 18 u/s)
const pathZ = []; {
  const dt = 1 / 600; let z = -180; for (let i = 0; i <= DOG * 600 + 10; i++) {
    pathZ.push(z); const t = i * dt; const v = lerp(40, 18, smooth(4.6, 5.8, t)); z += v * dt;
  }
}
// t >= DOG: Hermite spline through keyframes (with a vertical loop)
const LC = V(0, 80, 830), LR = 30;                       // loop centre / radius
const keys = [
  [9.0, V(-75, 20, 410)], [10.0, V(-50, 32, 480)], [11.0, V(-22, 52, 548)], [11.8, V(-6, 50, 605)],
  [12.6, V(6, 49, 660)], [13.4, V(-6, 49, 715)], [14.2, V(6, 50, 770)], [14.6, V(2, 50, 800)],
];
for (let k = 0; k <= 8; k++) { const ph = k / 8 * Math.PI * 2; keys.push([LOOP0 + k / 8 * (LOOP1 - LOOP0), V(0, LC.y - LR * Math.cos(ph), LC.z + LR * Math.sin(ph))]); }

}

window.renderAt = (t) => {
  enemies.forEach((e, i) => { e.g.visible = t < e.die + 0.04; if (!e.g.visible) return; e.g.position.copy(E(i, t)); e.g.lookAt(F(t)); e.g.rotateZ(Math.sin(t * 0.9 + e.ph) * 0.25); });
  chasers.forEach((c, i) => {
    c.g.visible = t > DOG - 0.5 && t < c.die + 0.04; if (!c.g.visible) return;
    const p = C(i, t); c.g.position.copy(p); c.g.lookAt(p.clone().add(Cdir(i, t))); c.g.rotateZ(Math.sin(t * 1.9 + c.ph) * 0.5);
  });
  mother.visible = t < FINAL + 0.06;
  for (const l of lasers) {
    const dt = t - l.t0; l.m.visible = dt >= 0 && dt <= l.life; if (!l.m.visible) continue;
    l.m.position.copy(l.p0).addScaledVector(l.v, dt); l.m.lookAt(l.m.position.clone().add(l.v)); l.m.scale.set(1, 1, l.len);
  }
  charge.visible = t > CHARGE && t < FIRE + 0.05;
  if (charge.visible) { charge.position.copy(fighterPoint(t, noseTip)); const s = 0.5 + 5 * smooth(CHARGE, FIRE, t) + 0.6 * Math.sin(t * 90); charge.scale.set(s, s, 1); }
  orb.visible = orbTrail.visible = t >= FIRE && t < HIT;
  if (orb.visible) {
    const p = orbPos(t), back = orbPos(t - 0.12); orb.position.copy(p); orb.scale.set(7 + Math.sin(t * 70), 7 + Math.sin(t * 70), 1);
    orbTrail.position.copy(p).add(back).multiplyScalar(0.5); orbTrail.lookAt(p); orbTrail.scale.set(6, 6, Math.max(0.01, p.distanceTo(back)));
  }
  setFighter(t);

  const [pos, look, fov] = shotCamera(t);
  camera.position.copy(pos); camera.fov = fov; camera.updateProjectionMatrix();
  explosions.forEach(ex => ex.update(t));
  camera.position.add(shake(t)); camera.lookAt(look);
  // never let a debris shard cover the lens
  explosions.forEach(ex => ex.shards.forEach(o => { if (o.m.visible && o.m.position.distanceTo(camera.position) < 10) o.m.visible = false; }));
  explosions.filter(ex => ex.light > 0).sort((a, b) => b.light - a.light).slice(0, 4).concat([null, null, null, null]).slice(0, 4)
    .forEach((ex, k) => { lightPool[k].intensity = ex ? ex.light : 0; if (ex) lightPool[k].position.copy(ex.pos); });

  // overlays
  el('white').style.opacity = smooth(21.45, 21.7, t) * (1 - smooth(21.95, 22.7, t));
  el('black').style.opacity = Math.max(1 - smooth(0, 0.8, t), smooth(22.2, 23.2, t) * 0.45, smooth(26.2, 27.0, t));
  el('title').style.opacity = smooth(TITLE, TITLE + 1, t) * (1 - smooth(26.2, 26.9, t));
  el('title').querySelector('h1').style.letterSpacing = lerp(0.36, 0.2, smooth(TITLE, TITLE + 1.5, t)) + 'em';
  el('title').querySelector('.line').style.width = (smooth(TITLE + 0.6, TITLE + 1.6, t) * 620) + 'px';
  el('title').querySelector('p').style.opacity = smooth(TITLE + 1.2, TITLE + 2.0, t);
  grade.uniforms.seed.value = (t * 30) % 97;
  composer.render();
};
window.DURATION = DURATION;
window.getEvents = () => ({
  duration: DURATION,
  lasers: lasers.map(l => ({ t: +l.t0.toFixed(3), type: l.type })),
  explosions: explosions.map(e => ({ t: +e.t0.toFixed(3), s: e.s, kind: e.kind })),
  whooshes: [3.9, 10.6, 15.5, 21.4],
  drums: [4.0, HIT], charge: CHARGE, fire: FIRE, hit: HIT, whiteout: 21.5, title: TITLE
});
window.renderAt(0);
window.ready = true;
</script>
</body>
